name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Train model for the artifact
        run: python -m core.train_model

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: extremism-detector
          include-hidden-files: true
          if-no-files-found: error
          path: |
            app_final.py
            core/
            model/
            data/training_data_mock.csv
            requirements.txt
            .env.example
            README.md

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t extremism-detector .

      - name: Start container
        run: docker run -d --name api -p 8000:8000 extremism-detector

      - name: Smoke test
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/version
          curl -fsS -X POST http://127.0.0.1:8000/analyze \
            -H "Content-Type: application/json" \
            -d '{"text": "Сегодня хорошая погода"}'

      - name: Container logs
        if: always()
        run: docker logs api
